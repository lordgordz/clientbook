<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Client Book">
<meta name="theme-color" content="#1f3a5f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Client Book</title>
<style>
:root {
  --bg: #f4f2ee; --card: #fff; --ink: #1c2430; --muted: #6b7380; --line: #e4e0d8;
  --accent: #1f3a5f; --accent-2: #2f5d8f; --accent-soft: #e8eef6;
  --ok: #2f7a4d; --ok-soft: #e6f3eb; --warn: #8a6100; --warn-soft: #fbf1d9;
  --err: #a33a2b; --err-soft: #f8e5e1; --radius: 12px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
a { color: var(--accent-2); text-decoration: none; }
h1 { margin: 0; font-size: 26px; letter-spacing: -0.01em; }
h2 { margin: 0 0 14px; font-size: 17px; font-weight: 650; }
h2 small { color: var(--muted); font-weight: 500; margin-left: 6px; font-size: 14px; }
h3 { font-size: 15px; margin: 18px 0 10px; }
.muted { color: var(--muted); }
.why { display: block; font-size: 13px; color: var(--muted); line-height: 1.4; margin-top: 2px; }
.why b { font-weight: 600; color: var(--ink); }
mark { background: #fbe7a6; color: inherit; border-radius: 3px; padding: 0 1px; }
.nick { color: var(--muted); font-weight: 500; }
h1 .nick { font-size: 20px; }
.small { font-size: 14px; }
.none { color: #a7acb4; }
.pre { white-space: pre-wrap; word-break: break-word; }
.nowrap { white-space: nowrap; }
.due { color: var(--err); font-weight: 600; }

/* top bar */
.topbar { position: sticky; top: 0; z-index: 20; display: flex; gap: 10px; align-items: center;
  padding: calc(10px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) 10px calc(16px + env(safe-area-inset-left));
  background: var(--accent); color: #fff; }
.back { background: none; border: 0; color: #fff; font-size: 34px; line-height: 1; padding: 0 6px 4px 0; cursor: pointer; min-height: 44px; }
.brand { color: #fff; font-weight: 700; font-size: 17px; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.mark { background: #fff; color: var(--accent); border-radius: 6px; padding: 2px 6px; font-size: 13px; }
.search { position: relative; flex: 1; min-width: 0; }
.search input { width: 100%; padding: 10px 12px; border-radius: 10px; border: 0; font-size: 16px; min-height: 44px; }
.suggest { position: absolute; left: 0; right: 0; top: 50px; background: #fff; border-radius: 10px;
  box-shadow: 0 10px 30px rgba(0,0,0,.2); overflow: hidden; }
.suggest a { display: flex; flex-direction: column; padding: 11px 14px; color: var(--ink); border-bottom: 1px solid var(--line); }
.suggest a span { color: var(--muted); font-size: 13px; }
.suggest a.on, .suggest a:active { background: var(--accent-soft); }

.wrap { max-width: 1180px; margin: 0 auto;
  padding: 18px calc(16px + env(safe-area-inset-right)) calc(60px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left)); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px; margin-bottom: 16px; }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; border: 1px solid var(--line); background: #fff; color: var(--ink);
  padding: 10px 16px; min-height: 44px; border-radius: 10px; font: inherit; font-size: 15px; cursor: pointer; white-space: nowrap; }
.btn:active { background: #f1efe9; }
.btn.primary { background: var(--accent-2); border-color: var(--accent-2); color: #fff; }
.btn.primary:active { background: var(--accent); }
.btn.light { background: #fff; color: var(--accent); border-color: #fff; font-weight: 600; }
.btn.ghost { background: transparent; color: #fff; border-color: rgba(255,255,255,.35); padding: 10px 12px; }
.btn.danger { color: var(--err); border-color: #e9c9c3; }
.btn.small { padding: 6px 12px; min-height: 36px; font-size: 14px; }
.link { background: none; border: 0; padding: 6px 4px; color: var(--accent-2); cursor: pointer; font: inherit; }
.link.danger { color: var(--err); }
.icon { background: none; border: 0; color: #a7acb4; cursor: pointer; font-size: 16px; min-width: 40px; min-height: 40px; border-radius: 8px; }
.icon:active { color: var(--err); background: var(--err-soft); }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom)); z-index: 50;
  max-width: min(560px, 92vw); padding: 12px 18px; border-radius: 12px; box-shadow: 0 8px 30px rgba(0,0,0,.18); font-size: 15px; }
.toast.ok { background: #1f3a2c; color: #fff; }
.toast.warn { background: var(--warn-soft); color: var(--warn); border: 1px solid #ecd9a5; }
.toast.error { background: var(--err); color: #fff; }
.banner { background: var(--accent-soft); padding: 12px 14px; border-radius: 10px; margin: 0 0 12px; }
.banner.warn { background: var(--warn-soft); color: var(--warn); display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }

/* dashboard */
.dash { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
ul.mini, ul.results { list-style: none; margin: 0; padding: 0; }
ul.mini li { display: flex; justify-content: space-between; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); }
ul.mini li:last-child { border-bottom: 0; }
ul.results li a { display: flex; flex-direction: column; padding: 12px 0; border-bottom: 1px solid var(--line); }
ul.results li a span { color: var(--muted); font-size: 14px; }
.row-between { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 10px; }
.row-between h2 { margin: 0; white-space: nowrap; }
.filter { padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px; font: inherit; width: 280px; max-width: 60%; }

/* tables */
.table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table.list { width: 100%; border-collapse: collapse; font-size: 15px; }
table.list th { text-align: left; color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase;
  letter-spacing: .04em; padding: 8px 10px; border-bottom: 1px solid var(--line); }
table.list td { padding: 11px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.list tr:last-child td { border-bottom: 0; }
table.list td a { display: block; }

/* forms */
.form fieldset { border: 0; border-top: 1px solid var(--line); margin: 0; padding: 16px 0 8px; min-width: 0; }
.form legend { font-weight: 650; padding-right: 10px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px 18px; }
.grid label { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.grid label.wide { grid-column: 1 / -1; }
.datebox { position: relative; display: flex; }
.datebox .dtext { padding-right: 50px; font-variant-numeric: tabular-nums; letter-spacing: .02em; }
.dpick { position: absolute; right: 0; top: 0; bottom: 0; width: 46px; display: flex; align-items: center; justify-content: center;
  color: var(--accent-2); border-left: 1px solid #d6d2c9; }
.dpick input[type=date] { position: absolute; inset: 0; width: 100%; height: 100%; min-height: 0; opacity: 0; border: 0; padding: 0; cursor: pointer; }
.dhint { font-size: 13px; color: var(--muted); min-height: 18px; }
.dhint.bad { color: var(--err); }
label > span { font-size: 14px; font-weight: 600; }
em { font-style: normal; font-weight: 500; font-size: 12px; color: #a7acb4; margin-left: 4px; }
em.req { color: var(--err); }
input, select, textarea { font: inherit; font-size: 16px; padding: 10px 12px; min-height: 44px; border: 1px solid #d6d2c9; border-radius: 10px;
  background: #fff; color: var(--ink); width: 100%; -webkit-appearance: none; appearance: none; }
select { background-image: linear-gradient(45deg, transparent 50%, #6b7380 50%), linear-gradient(135deg, #6b7380 50%, transparent 50%);
  background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 32px; }
input[type=date] { min-height: 44px; }
textarea { resize: vertical; }
input:focus, select:focus, textarea:focus { outline: 3px solid var(--accent-soft); border-color: var(--accent-2); }
.actions { display: flex; gap: 10px; padding-top: 16px; border-top: 1px solid var(--line); margin-top: 10px; }
.extra-row { display: grid; grid-template-columns: 220px 1fr auto; gap: 10px; margin-bottom: 10px; align-items: start; }
.inline-form { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.inline-form input, .inline-form select { width: auto; }
.inline-form .grow { flex: 1; min-width: 220px; }
.inline-form label { display: flex; align-items: center; gap: 8px; }
.stack { display: flex; flex-direction: column; gap: 10px; }
details > summary { list-style: none; margin-top: 12px; }
details > summary::-webkit-details-marker { display: none; }
details[open] > summary { margin-bottom: 12px; }

/* profile */
.hero { display: flex; gap: 16px; align-items: center; }
.avatar { width: 64px; height: 64px; border-radius: 50%; background: var(--accent); color: #fff;
  display: grid; place-items: center; font-size: 28px; font-weight: 700; flex: none; }
.who { flex: 1; min-width: 0; }
.who p { margin: 4px 0 0; }
.stamps { display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: 14px; color: var(--muted); }
.stamps b { color: var(--ink); font-weight: 600; }
.stamps .due b { color: var(--err); }
.cols { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; align-items: start; }
dl.details { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px 22px; margin: 0; }
dl.details .f.wide { grid-column: 1 / -1; }
dl.details dt { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; font-weight: 600; }
dl.details dd { margin: 2px 0 0; word-break: break-word; }
dl.extras { margin-top: 16px; padding-top: 16px; border-top: 1px dashed var(--line); }
.remarks { background: #faf8f3; border-left: 3px solid var(--accent-2); padding: 12px 14px; border-radius: 0 10px 10px 0; }
.nric { font-family: ui-monospace, Menlo, Consolas, monospace; }
.note-add { display: flex; flex-direction: column; gap: 10px; align-items: flex-start; margin-bottom: 8px; }
.note { border-top: 1px solid var(--line); padding: 12px 0; }
.note-head { display: flex; justify-content: space-between; align-items: center; }
.note-edit { display: none; flex-direction: column; gap: 10px; align-items: flex-start; }
.note.editing .note-edit { display: flex; }
.note.editing .note-text { display: none; }
ul.family { list-style: none; padding: 0; margin: 0; }
ul.family li { display: flex; align-items: center; gap: 4px; border: 1px solid var(--line); border-radius: 10px; margin-bottom: 8px; }
ul.family li a { flex: 1; display: flex; flex-direction: column; padding: 10px 14px; color: var(--ink); min-width: 0; }
ul.family li a:active { background: var(--accent-soft); border-radius: 10px 0 0 10px; }
ul.family .rel { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--accent-2); font-weight: 700; }
ul.family b { color: var(--accent-2); }
.family-add { border-top: 1px solid var(--line); margin-top: 12px; }
.or { margin: 14px 0 8px; }
.danger-zone { text-align: center; }
.stat { display: flex; flex-wrap: wrap; gap: 8px 22px; margin: 0 0 6px; }
.steps { margin: 8px 0 0; padding-left: 20px; }
.steps li { margin-bottom: 6px; }

@media (max-width: 900px) {
  .dash { grid-template-columns: minmax(0, 1fr); }
  .cols { grid-template-columns: minmax(0, 1fr); }
  .col-side { order: -1; }
}
@media (max-width: 640px) {
  .brand-text { display: none; }
  .hero { flex-wrap: wrap; }
  .extra-row { grid-template-columns: 1fr auto; }
  .extra-row textarea { grid-column: 1 / 2; }
  .filter { width: 160px; }
}
</style>
</head>
<body>
<header class="topbar">
  <button id="back" class="back" hidden aria-label="Back" onclick="goBack()">‹</button>
  <a class="brand" href="#/"><span class="mark">CB</span><span class="brand-text">Client Book</span></a>
  <div class="search">
    <input id="q" type="search" placeholder="Search anything — names, addresses, notes, policies…" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
    <div id="suggest" class="suggest" hidden></div>
  </div>
  <a class="btn light" href="#/new">+ New</a>
  <a class="btn ghost" href="#/data" title="Backup &amp; data" aria-label="Backup and data">⇅</a>
</header>
<main id="app" class="wrap"></main>
<div id="toast" class="toast" hidden></div>

<script>
'use strict';
/* =========================================================================
   Data layout — identical sheets and columns to the computer version's
   clients.xlsx, so the two can share one Excel file.
   ========================================================================= */
const SHEETS = {
  'Clients': ['ID', 'Name', 'Nickname', 'Gender', 'NRIC', 'Date of Birth', 'Phone', 'Email', 'Address',
              'Occupation', 'Company', 'Income Range', 'How We Met', 'First Met', 'Last Met',
              'Next Follow-up', 'Remarks', 'Created', 'Last Updated'],
  'Family': ['Client ID', 'Related ID', 'Relationship'],
  'Extra Details': ['Client ID', 'Field', 'Value'],
  'Notes': ['ID', 'Client ID', 'Added', 'Note'],
  'Interactions': ['ID', 'Client ID', 'Date', 'Type', 'Notes'],
  'Policies': ['ID', 'Client ID', 'Product', 'Insurer', 'Policy No', 'Start Date', 'Premium',
               'Frequency', 'Status', 'Notes'],
};
// Columns that were renamed — older Excel files and saved data are upgraded automatically.
const RENAMED = { 'Clients': { 'Workplace': 'Company' } };
const KEY = { 'Clients': 'clients', 'Family': 'family', 'Extra Details': 'extras', 'Notes': 'notes',
              'Interactions': 'interactions', 'Policies': 'policies' };
const DATE_F = new Set(['Date of Birth', 'First Met', 'Last Met', 'Next Follow-up', 'Start Date', 'Date']);
const STAMP_F = new Set(['Created', 'Last Updated', 'Added']);
const NUM_F = new Set(['Premium']);
const LONG_F = new Set(['Address', 'Remarks', 'Notes', 'Note', 'Value']);

const GENDERS = ['Male', 'Female'];
const INCOME_RANGES = ['Below $3k / month', '$3k – $6k / month', '$6k – $10k / month', '$10k – $20k / month', 'Above $20k / month'];
const HOW_MET = ['Referral', 'Friend / family', 'Colleague', 'Roadshow', 'Event / seminar', 'Social media', 'Cold call', 'Walk-in', 'Other'];
const INTERACTION_TYPES = ['Meeting', 'Meal / coffee', 'Policy review', 'Event', 'Call', 'Message', 'Email', 'Other'];
const IN_PERSON = new Set(['Meeting', 'Meal / coffee', 'Policy review', 'Event']);
const POLICY_STATUS = ['In force', 'Pending', 'Lapsed', 'Surrendered', 'Matured', 'Claimed'];
const FREQUENCIES = ['Monthly', 'Quarterly', 'Half-yearly', 'Yearly', 'Single'];
const EXTRA_SUGGESTIONS = ['Preferred language', 'Hobbies', 'Favourite food', 'Dietary needs', "Kids' school",
  'Pets', 'Car', 'Wedding anniversary', 'Preferred contact time', 'Social media', 'Referred by', 'Referred to', 'Life goals', 'Concerns'];

// "Related person is the client's <key>": [reverse key, male label, female label, neutral label]
const RELATIONS = {
  'spouse': ['spouse', 'Husband', 'Wife', 'Spouse'],
  'parent': ['child', 'Father', 'Mother', 'Parent'],
  'child': ['parent', 'Son', 'Daughter', 'Child'],
  'sibling': ['sibling', 'Brother', 'Sister', 'Sibling'],
  'grandparent': ['grandchild', 'Grandfather', 'Grandmother', 'Grandparent'],
  'grandchild': ['grandparent', 'Grandson', 'Granddaughter', 'Grandchild'],
  'parent-in-law': ['child-in-law', 'Father-in-law', 'Mother-in-law', 'Parent-in-law'],
  'child-in-law': ['parent-in-law', 'Son-in-law', 'Daughter-in-law', 'Child-in-law'],
  'sibling-in-law': ['sibling-in-law', 'Brother-in-law', 'Sister-in-law', 'Sibling-in-law'],
  'uncle/aunt': ['niece/nephew', 'Uncle', 'Aunt', 'Uncle / Aunt'],
  'niece/nephew': ['uncle/aunt', 'Nephew', 'Niece', 'Niece / Nephew'],
  'cousin': ['cousin', 'Cousin', 'Cousin', 'Cousin'],
  'other': ['other', 'Other', 'Other', 'Other relative'],
};

// Only Name is required.
const SECTIONS = [
  ['Personal', [
    { label: 'Name', type: 'text', required: true },
    { label: 'Nickname', type: 'text', placeholder: 'What you call them' },
    { label: 'Gender', type: 'select', options: GENDERS },
    { label: 'NRIC', type: 'text', placeholder: 'S1234567A', caps: 'characters' },
    { label: 'Date of Birth', type: 'date' },
  ]],
  ['Contact', [
    { label: 'Phone', type: 'tel' },
    { label: 'Email', type: 'email' },
    { label: 'Address', type: 'textarea', wide: true },
  ]],
  ['Work', [
    { label: 'Occupation', type: 'text', autofill: true },
    { label: 'Company', type: 'text', autofill: true },
    { label: 'Income Range', type: 'select', options: INCOME_RANGES },
  ]],
  ['How we know each other', [
    { label: 'How We Met', type: 'text', autofill: true, wide: true, placeholder: 'e.g. Referral from Jason, roadshow at Tampines Mall…' },
    { label: 'First Met', type: 'date' },
    { label: 'Last Met', type: 'date' },
    { label: 'Next Follow-up', type: 'date' },
  ]],
  ['Special remarks', [
    { label: 'Remarks', type: 'textarea', wide: true, rows: 6,
      placeholder: 'Anything worth remembering — personality, preferences, health notes, family situation, plans… Write as much as you like.' },
  ]],
];
const FORM_FIELDS = SECTIONS.flatMap(([, fs]) => fs.map(f => f.label));

/* =========================================================================
   Small helpers
   ========================================================================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '');
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const isISO = v => typeof v === 'string' && /^\d{4}-\d{2}-\d{2}/.test(v);
const blank = h => (DATE_F.has(h) || STAMP_F.has(h) || NUM_F.has(h)) ? null : '';
const nick = c => c && c.Nickname ? ` <span class="nick">“${esc(c.Nickname)}”</span>` : '';
const byName = (a, b) => String(a.Name || '').localeCompare(String(b.Name || ''), undefined, { sensitivity: 'base' });

function todayISO() { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function nowStamp() { const d = new Date(); return `${todayISO()}T${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; }
function parseISO(s) { const m = isISO(s) && /^(\d{4})-(\d{2})-(\d{2})/.exec(s); return m ? new Date(+m[1], m[2] - 1, +m[3]) : null; }
function today() { return parseISO(todayISO()); }
function fmtDate(s) {
  const d = parseISO(s); if (!d) return s || '';
  let out = `${pad(d.getDate())} ${MON[d.getMonth()]} ${d.getFullYear()}`;
  if (s.length > 10) out += ', ' + s.slice(11, 16);
  return out;
}
function daysFrom(a, b) { return Math.round((b - a) / 864e5); }
function ago(s) {
  const d = parseISO(s); if (!d) return '';
  const n = daysFrom(d, today());
  if (n < 0) return `in ${-n} day${n === -1 ? '' : 's'}`;
  if (n === 0) return 'today';
  if (n < 31) return `${n} day${n > 1 ? 's' : ''} ago`;
  if (n < 365) { const m = Math.floor(n / 30); return `${m} month${m > 1 ? 's' : ''} ago`; }
  const y = Math.floor(n / 365); return `${y} year${y > 1 ? 's' : ''} ago`;
}
function ageOf(dob, on) {
  const d = parseISO(dob); if (!d) return null; on = on || today();
  const before = on.getMonth() < d.getMonth() || (on.getMonth() === d.getMonth() && on.getDate() < d.getDate());
  return on.getFullYear() - d.getFullYear() - (before ? 1 : 0);
}
function nextBirthday(dob, t) {
  const d = parseISO(dob);
  const make = y => { const x = new Date(y, d.getMonth(), d.getDate()); return x.getMonth() !== d.getMonth() ? new Date(y, 2, 1) : x; };
  let nb = make(t.getFullYear()); if (nb < t) nb = make(t.getFullYear() + 1); return nb;
}
function maskNric(v) { v = v || ''; return v.length < 5 ? v : v[0] + '•'.repeat(v.length - 5) + v.slice(-4); }
function money(v) { return typeof v === 'number' ? '$' + v.toLocaleString('en-SG', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : (v || ''); }
function nextId(rows, prefix) {
  let n = 0; const re = new RegExp('^' + prefix + '(\\d+)$');
  for (const r of rows) { const m = re.exec(String(r.ID || '')); if (m) n = Math.max(n, +m[1]); }
  return prefix + String(n + 1).padStart(4, '0');
}

/* =========================================================================
   Storage — kept on this device (IndexedDB, falls back to localStorage)
   ========================================================================= */
function emptyDb() { return { clients: [], family: [], extras: [], notes: [], interactions: [], policies: [], meta: { lastExport: null, lastChange: null } }; }
let db = emptyDb();
let _idb;
function openIdb() {
  if (!_idb) _idb = new Promise((res, rej) => {
    const r = indexedDB.open('clientbook', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
  return _idb;
}
async function kvGet(k) {
  try {
    const d = await openIdb();

let _docs = null;
function searchDocs() {

  for (const c of db.clients) {

  for (const p of db.policies) add(p['Client ID'], 'Policy', [p.Product, p.Insurer, p['Policy No'], p.Status, p.Frequency, p.Notes].filter(Boolean).join(' · '));

const PROFILE_KEYS = new Set(['Company', 'Address', 'Occupation', 'Email', 'Phone', 'How We Met', 'NRIC']);

  const rest = tokens.filter(t => !name.includes(t)), hits = (searchDocs()[c.ID] || []).filter(([, v]) => rest.some(t => v.toLowerCase().includes(t)));
  if (!hits.length) return '';

async function saveClient(e) {
  e.preventDefault();
  const form = e.target, fd = new FormData(form), { cid, link, rel } = form.dataset;
  const data = {};
  for (const label of FORM_FIELDS) {
    let v = String(fd.get(slug(label)) || '').trim();
    if (label === 'NRIC') v = v.toUpperCase().replace(/\s+/g, '');
    if (DATE_F.has(label) && v) {
      const iso = parseTyped(v);
      if (!iso) { const el = form.querySelector(`[name="${slug(label)}"]`); checkDate(el); el.focus(); toast(`${label}: type the date as DD/MM/YYYY.`, 'error'); return false; }
      v = iso;
    }
    data[label] = v || blank(label);
  }
  const fs = fd.getAll('extra_field'), vs = fd.getAll('extra_value'), extras = [];
  fs.forEach((f, i) => { f = String(f).trim(); const v = String(vs[i] || '').trim(); if (f || v) extras.push({ Field: f || 'Note', Value: v }); });
  if (!data.Name) { toast('Name is required — everything else is optional.', 'error'); return false; }
  const warn = [];
  if (data.NRIC) {
    if (!/^[STFGM]\d{7}[A-Z]$/.test(data.NRIC)) warn.push(`NRIC “${data.NRIC}” doesn’t look like a standard NRIC/FIN — saved anyway.`);
    const dup = db.clients.find(c => c.ID !== cid && String(c.NRIC || '').toUpperCase() === data.NRIC);
    if (dup) { toast(`That NRIC already belongs to ${dup.Name} (${dup.ID}).`, 'error'); return false; }
  }
  let target;
  if (cid) { target = getClient(cid); Object.assign(target, data); }
  else {
    target = {}; for (const h of SHEETS.Clients) target[h] = blank(h);
    Object.assign(target, data, { ID: nextId(db.clients, 'C'), Created: nowStamp() });
    db.clients.push(target);
  }
  touch(target); setExtras(target.ID, extras);
  let msg = cid ? 'Profile updated.' : `Saved ${target.Name}.`, dest = '#/c/' + encodeURIComponent(target.ID), anchor = null;
  const lc = link && getClient(link);
  if (!cid && lc && RELATIONS[rel]) { addLink(lc.ID, target.ID, rel); touch(lc); msg = `Saved ${target.Name} and linked to ${lc.Name}.`; dest = '#/c/' + encodeURIComponent(lc.ID); anchor = 'family'; }
  if (warn.length) msg += ' ' + warn.join(' ');
  await commit(msg, dest, anchor, true, warn.length ? 'warn' : 'ok');
  return false;
}

/* =========================================================================
   Excel (.xlsx) — written and read without any outside library
   ========================================================================= */
const XLSX_MIME = 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
const te = new TextEncoder(), td = new TextDecoder();
const EPOCH = Date.UTC(1899, 11, 30);
function toSerial(iso) {
  const [d, t] = iso.split('T'), [y, m, dd] = d.split('-').map(Number);
  let s = (Date.UTC(y, m - 1, dd) - EPOCH) / 864e5;
  if (t) { const [h, mi, se] = t.split(':').map(Number); s += ((h || 0) * 3600 + (mi || 0) * 60 + (se || 0)) / 86400; }
  return s;
}
function fromSerial(n) {
  const d = new Date(Math.round(n * 864e5) + EPOCH);
  return `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}T${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}:${pad(d.getUTCSeconds())}`;
}

// ---- reading
async function inflateRaw(bytes) {

// Nicknames typed into Extra details before the Nickname field existed move into it.
function moveNicknames(d) {
  d.extras = d.extras.filter(e => {
    if (String(e.Field || '').trim().toLowerCase() !== 'nickname') return true;
    const c = d.clients.find(x => x.ID === e['Client ID']);
    if (c && !c.Nickname) { c.Nickname = e.Value; return false; }
    return true;
  });

function bookToDb(book) {
  const nd = emptyDb();
  if (!book['Clients']) throw new Error('This file has no “Clients” sheet — is it a Client Book file?');
  for (const [name, headers] of Object.entries(SHEETS)) {
    const rows = book[name]; if (!rows || !rows.length) continue;
    const head = (rows[0] || []).map(v => v == null ? '' : String(v).trim());
    for (const [o, n] of Object.entries(RENAMED[name] || {})) { const i = head.indexOf(o); if (i >= 0 && !head.includes(n)) head[i] = n; }
    for (let i = 1; i < rows.length; i++) {
      const r = rows[i]; if (!r || r.every(v => v == null || v === '')) continue;
      const o = {}; for (const h of headers) { const ci = head.indexOf(h); o[h] = cellIn(h, ci >= 0 ? r[ci] : null); }
      nd[KEY[name]].push(o);

  nd.clients = nd.clients.filter(c => c.Name);
  moveNicknames(nd);
  for (const c of nd.clients) if (!c.ID) c.ID = nextId(nd.clients, 'C');

async function importExcel(input) {
  const file = input.files && input.files[0]; input.value = ''; if (!file) return;

    const nd = bookToDb(await readXlsx(await file.arrayBuffer()));
    const msg = `Replace everything on this iPad (${db.clients.length} clients) with ${nd.clients.length} clients from “${file.name}”?`
      + (db.clients.length ? '\n\nYou can undo this afterwards from this page.' : '');
    if (!confirm(msg)) return;
    if (db.clients.length) await kvSet('prev', JSON.parse(JSON.stringify(db)));
    nd.meta = { lastExport: nowStamp(), lastChange: null };

async function undoImport() {

/* =========================================================================
   Header search with live suggestions
   ========================================================================= */
(function () {
  const q = $('#q'), box = $('#suggest'); let items = [], active = -1;
  const draw = () => {
    if (!items.length) { box.hidden = true; return; }
    box.innerHTML = items.map((c, i) => `<a href="#/c/${encodeURIComponent(c.ID)}" class="${i === active ? 'on' : ''}"><b>${esc(c.Name)}${nick(c)}</b>
      <span>${[c.Company, c.Phone, c.ID].filter(Boolean).map(esc).join(' · ')}</span>${matchInfo(c, q.value)}</a>`).join('');
    box.hidden = false;
  };
  q.addEventListener('input', () => { items = q.value.trim() ? searchClients(q.value).slice(0, 8) : []; active = -1; draw(); });
  q.addEventListener('focus', () => { if (q.value.trim()) { items = searchClients(q.value).slice(0, 8); draw(); } });
  q.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown' && items.length) { active = Math.min(active + 1, items.length - 1); draw(); e.preventDefault(); }
    else if (e.key === 'ArrowUp' && items.length) { active = Math.max(active - 1, 0); draw(); e.preventDefault(); }
    else if (e.key === 'Enter') {
      e.preventDefault(); const v = q.value.trim(); if (!v) return;
      const target = active >= 0 ? items[active] : null; box.hidden = true; q.blur();
      location.hash = target ? '#/c/' + encodeURIComponent(target.ID) : '#/search?q=' + encodeURIComponent(v);
    } else if (e.key === 'Escape') box.hidden = true;
  });
  box.addEventListener('click', () => { box.hidden = true; q.blur(); });
  document.addEventListener('click', e => { if (!box.contains(e.target) && e.target !== q) box.hidden = true; });
})();

/* =========================================================================
   Start
   ========================================================================= */
window.addEventListener('hashchange', render);
(async function start() {
  const saved = await kvGet('db');
  if (saved) db = Object.assign(emptyDb(), saved, { meta: Object.assign(emptyDb().meta, saved.meta || {}) });
  moveNicknames(db);
  for (const [sheet, map] of Object.entries(RENAMED)) for (const r of db[KEY[sheet]])
    for (const [o, n] of Object.entries(map)) if (o in r) { if (!r[n]) r[n] = r[o]; delete r[o]; }
  render();
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
