<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Client Book">
<meta name="theme-color" content="#1f3a5f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Client Book</title>
<style>
:root {
  --bg: #f4f2ee; --card: #fff; --ink: #1c2430; --muted: #6b7380; --line: #e4e0d8;
  --accent: #1f3a5f; --accent-2: #2f5d8f; --accent-soft: #e8eef6;
  --ok: #2f7a4d; --ok-soft: #e6f3eb; --warn: #8a6100; --warn-soft: #fbf1d9;
  --err: #a33a2b; --err-soft: #f8e5e1; --radius: 12px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
a { color: var(--accent-2); text-decoration: none; }
h1 { margin: 0; font-size: 26px; letter-spacing: -0.01em; }
h2 { margin: 0 0 14px; font-size: 17px; font-weight: 650; }
h2 small { color: var(--muted); font-weight: 500; margin-left: 6px; font-size: 14px; }
h3 { font-size: 15px; margin: 18px 0 10px; }
.muted { color: var(--muted); }
.why { display: block; font-size: 13px; color: var(--muted); line-height: 1.4; margin-top: 2px; }
.why b { font-weight: 600; color: var(--ink); }
mark { background: #fbe7a6; color: inherit; border-radius: 3px; padding: 0 1px; }
.nick { color: var(--muted); font-weight: 500; }
h1 .nick { font-size: 20px; }
.small { font-size: 14px; }
.none { color: #a7acb4; }
.pre { white-space: pre-wrap; word-break: break-word; }
.nowrap { white-space: nowrap; }
.due { color: var(--err); font-weight: 600; }

/* top bar */
.topbar { position: sticky; top: 0; z-index: 20; display: flex; gap: 10px; align-items: center;
  padding: calc(10px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) 10px calc(16px + env(safe-area-inset-left));
  background: var(--accent); color: #fff; }
.back { background: none; border: 0; color: #fff; font-size: 34px; line-height: 1; padding: 0 6px 4px 0; cursor: pointer; min-height: 44px; }
.brand { color: #fff; font-weight: 700; font-size: 17px; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.mark { background: #fff; color: var(--accent); border-radius: 6px; padding: 2px 6px; font-size: 13px; }
.search { position: relative; flex: 1; min-width: 0; }
.search input { width: 100%; padding: 10px 12px; border-radius: 10px; border: 0; font-size: 16px; min-height: 44px; }
.suggest { position: absolute; left: 0; right: 0; top: 50px; background: #fff; border-radius: 10px;
  box-shadow: 0 10px 30px rgba(0,0,0,.2); overflow: hidden; }
.suggest a { display: flex; flex-direction: column; padding: 11px 14px; color: var(--ink); border-bottom: 1px solid var(--line); }
.suggest a span { color: var(--muted); font-size: 13px; }
.suggest a.on, .suggest a:active { background: var(--accent-soft); }

.wrap { max-width: 1180px; margin: 0 auto;
  padding: 18px calc(16px + env(safe-area-inset-right)) calc(60px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left)); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px; margin-bottom: 16px; }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; border: 1px solid var(--line); background: #fff; color: var(--ink);
  padding: 10px 16px; min-height: 44px; border-radius: 10px; font: inherit; font-size: 15px; cursor: pointer; white-space: nowrap; }
.btn:active { background: #f1efe9; }
.btn.primary { background: var(--accent-2); border-color: var(--accent-2); color: #fff; }
.btn.primary:active { background: var(--accent); }
.btn.light { background: #fff; color: var(--accent); border-color: #fff; font-weight: 600; }
.btn.ghost { background: transparent; color: #fff; border-color: rgba(255,255,255,.35); padding: 10px 12px; }
.btn.danger { color: var(--err); border-color: #e9c9c3; }
.btn.small { padding: 6px 12px; min-height: 36px; font-size: 14px; }
.link { background: none; border: 0; padding: 6px 4px; color: var(--accent-2); cursor: pointer; font: inherit; }
.link.danger { color: var(--err); }
.icon { background: none; border: 0; color: #a7acb4; cursor: pointer; font-size: 16px; min-width: 40px; min-height: 40px; border-radius: 8px; }
.icon:active { color: var(--err); background: var(--err-soft); }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom)); z-index: 50;
  max-width: min(560px, 92vw); padding: 12px 18px; border-radius: 12px; box-shadow: 0 8px 30px rgba(0,0,0,.18); font-size: 15px; }
.toast.ok { background: #1f3a2c; color: #fff; }
.toast.warn { background: var(--warn-soft); color: var(--warn); border: 1px solid #ecd9a5; }
.toast.error { background: var(--err); color: #fff; }
.banner { background: var(--accent-soft); padding: 12px 14px; border-radius: 10px; margin: 0 0 12px; }
.banner.warn { background: var(--warn-soft); color: var(--warn); display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }

/* dashboard */
.dash { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
ul.mini, ul.results { list-style: none; margin: 0; padding: 0; }
ul.mini li { display: flex; justify-content: space-between; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); }
ul.mini li:last-child { border-bottom: 0; }
ul.results li a { display: flex; flex-direction: column; padding: 12px 0; border-bottom: 1px solid var(--line); }
ul.results li a span { color: var(--muted); font-size: 14px; }
.row-between { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 10px; }
.row-between h2 { margin: 0; white-space: nowrap; }
.filter { padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px; font: inherit; width: 280px; max-width: 60%; }

/* tables */
.table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table.list { width: 100%; border-collapse: collapse; font-size: 15px; }
table.list th { text-align: left; color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase;
  letter-spacing: .04em; padding: 8px 10px; border-bottom: 1px solid var(--line); }
table.list td { padding: 11px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.list tr:last-child td { border-bottom: 0; }
table.list td a { display: block; }

/* forms */
.form fieldset { border: 0; border-top: 1px solid var(--line); margin: 0; padding: 16px 0 8px; min-width: 0; }
.form legend { font-weight: 650; padding-right: 10px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px 18px; }
.grid label { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.grid label.wide { grid-column: 1 / -1; }
.datebox { position: relative; display: flex; }
.datebox .dtext { padding-right: 50px; font-variant-numeric: tabular-nums; letter-spacing: .02em; }
.dpick { position: absolute; right: 0; top: 0; bottom: 0; width: 46px; display: flex; align-items: center; justify-content: center;
  color: var(--accent-2); border-left: 1px solid #d6d2c9; }
.dpick input[type=date] { position: absolute; inset: 0; width: 100%; height: 100%; min-height: 0; opacity: 0; border: 0; padding: 0; cursor: pointer; }
.dhint { font-size: 13px; color: var(--muted); min-height: 18px; }
.dhint.bad, .dhint .bad { color: var(--err); }
.dhint .good { color: var(--ok); }
label > span { font-size: 14px; font-weight: 600; }
em { font-style: normal; font-weight: 500; font-size: 12px; color: #a7acb4; margin-left: 4px; }
em.req { color: var(--err); }
input, select, textarea { font: inherit; font-size: 16px; padding: 10px 12px; min-height: 44px; border: 1px solid #d6d2c9; border-radius: 10px;
  background: #fff; color: var(--ink); width: 100%; -webkit-appearance: none; appearance: none; }
select { background-image: linear-gradient(45deg, transparent 50%, #6b7380 50%), linear-gradient(135deg, #6b7380 50%, transparent 50%);
  background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 32px; }
input[type=date] { min-height: 44px; }
textarea { resize: vertical; }
input:disabled, select:disabled { background: #f1efe9; color: var(--muted); -webkit-text-fill-color: var(--muted); opacity: 1; }
input:focus, select:focus, textarea:focus { outline: 3px solid var(--accent-soft); border-color: var(--accent-2); }
.actions { display: flex; gap: 10px; padding-top: 16px; border-top: 1px solid var(--line); margin-top: 10px; }
.extra-row { display: grid; grid-template-columns: 220px 1fr auto; gap: 10px; margin-bottom: 10px; align-items: start; }
.inline-form { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.inline-form input, .inline-form select { width: auto; }
.inline-form .grow { flex: 1; min-width: 220px; }
.inline-form label { display: flex; align-items: center; gap: 8px; }
.stack { display: flex; flex-direction: column; gap: 10px; }
details > summary { list-style: none; margin-top: 12px; }
details > summary::-webkit-details-marker { display: none; }
details[open] > summary { margin-bottom: 12px; }

/* profile */
.hero { display: flex; gap: 16px; align-items: center; }
.avatar { width: 64px; height: 64px; border-radius: 50%; background: var(--accent); color: #fff;
  display: grid; place-items: center; font-size: 28px; font-weight: 700; flex: none; }
.who { flex: 1; min-width: 0; }
.who p { margin: 4px 0 0; }
.stamps { display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: 14px; color: var(--muted); }
.stamps b { color: var(--ink); font-weight: 600; }
.stamps .due b { color: var(--err); }
.cols { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; align-items: start; }
dl.details { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px 22px; margin: 0; }
dl.details .f.wide { grid-column: 1 / -1; }
dl.details dt { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; font-weight: 600; }
dl.details dd { margin: 2px 0 0; word-break: break-word; }
dl.extras { margin-top: 16px; padding-top: 16px; border-top: 1px dashed var(--line); }
.remarks { background: #faf8f3; border-left: 3px solid var(--accent-2); padding: 12px 14px; border-radius: 0 10px 10px 0; }
.nric { font-family: ui-monospace, Menlo, Consolas, monospace; }
.note-add { display: flex; flex-direction: column; gap: 10px; align-items: flex-start; margin-bottom: 8px; }
.note { border-top: 1px solid var(--line); padding: 12px 0; }
.note-head { display: flex; justify-content: space-between; align-items: center; }
.note-edit { display: none; flex-direction: column; gap: 10px; align-items: flex-start; }
.note.editing .note-edit { display: flex; }
.note.editing .note-text { display: none; }
ul.family { list-style: none; padding: 0; margin: 0; }
ul.family li { display: flex; align-items: center; gap: 4px; border: 1px solid var(--line); border-radius: 10px; margin-bottom: 8px; }
ul.family li a { flex: 1; display: flex; flex-direction: column; padding: 10px 14px; color: var(--ink); min-width: 0; }
ul.family li a:active { background: var(--accent-soft); border-radius: 10px 0 0 10px; }
ul.family .rel { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--accent-2); font-weight: 700; }
ul.family b { color: var(--accent-2); }
.family-add { border-top: 1px solid var(--line); margin-top: 12px; }
.suggest-links { background: var(--accent-soft); border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; font-size: 14px; }
.suggest-links ul { margin: 6px 0 10px; padding-left: 18px; }
.row-btns { display: flex; gap: 8px; flex-wrap: wrap; }
.or { margin: 14px 0 8px; }
.danger-zone { text-align: center; }
ul.pols { list-style: none; margin: 0; padding: 0; }
ul.pols li a { display: block; padding: 12px 4px; border-top: 1px solid var(--line); color: var(--ink); }
ul.pols li:first-child a { border-top: 0; }
ul.pols li a:active { background: var(--accent-soft); }
.pol-top { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
.pol-top b { color: var(--accent-2); font-size: 16px; }
.pol-meta { font-size: 14px; color: var(--muted); margin-top: 3px; }
.tag { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.tag.off { background: var(--err-soft); color: var(--err); }
.tag.done { background: var(--ok-soft); color: var(--ok); }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
.tile.wide { grid-column: 1 / -1; }
@media (max-width: 520px) { .tiles { grid-template-columns: minmax(0, 1fr); } }
.tile { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; }
.tile span { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 600; }
.tile b { font-size: 22px; font-weight: 650; letter-spacing: -.01em; }
.tile small { font-size: 13px; color: var(--muted); }
.tile.key { border-color: var(--accent-2); background: var(--accent-soft); }
.tile.key b { color: var(--accent); }
.tile .warn { color: var(--warn); }
.agents { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
.agents .card { margin-bottom: 0; }
.termbox { display: grid; grid-template-columns: minmax(0, 1fr) 110px; gap: 8px; }
.crumb { font-size: 14px; margin: 0 0 4px; }
.stat { display: flex; flex-wrap: wrap; gap: 8px 22px; margin: 0 0 6px; }
.steps { margin: 8px 0 0; padding-left: 20px; }
.steps li { margin-bottom: 6px; }

@media (max-width: 900px) {
  .dash { grid-template-columns: minmax(0, 1fr); }
  .cols { grid-template-columns: minmax(0, 1fr); }
  .col-side { order: -1; }
}
@media (max-width: 640px) {
  .brand-text { display: none; }
  .hero { flex-wrap: wrap; }
  .extra-row { grid-template-columns: 1fr auto; }
  .extra-row textarea { grid-column: 1 / 2; }
  .filter { width: 160px; }
}
</style>
</head>
<body>
<header class="topbar">
  <button id="back" class="back" hidden aria-label="Back" onclick="goBack()">‹</button>
  <a class="brand" href="#/"><span class="mark">CB</span><span class="brand-text">Client Book</span></a>
  <div class="search">
    <input id="q" type="search" placeholder="Search anything — names, addresses, notes, policies…" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
    <div id="suggest" class="suggest" hidden></div>
  </div>
  <a class="btn light" href="#/new">+ New</a>
  <a class="btn ghost" href="#/data" title="Backup &amp; data" aria-label="Backup and data">⇅</a>
</header>
<main id="app" class="wrap"></main>
<div id="toast" class="toast" hidden></div>

<script>
'use strict';
/* =========================================================================
   Data layout — identical sheets and columns to the computer version's
   clients.xlsx, so the two can share one Excel file.
   ========================================================================= */
const SHEETS = {
  'Clients': ['ID', 'Name', 'Nickname', 'Gender', 'NRIC', 'Date of Birth', 'Phone', 'Email', 'Address',
              'Occupation', 'Company', 'Income Range', 'How We Met', 'First Met', 'Last Met',
              'Next Follow-up', 'Remarks', 'Created', 'Last Updated'],
  'Family': ['Client ID', 'Related ID', 'Relationship'],
  'Extra Details': ['Client ID', 'Field', 'Value'],
  'Notes': ['ID', 'Client ID', 'Added', 'Note'],
  'Interactions': ['ID', 'Client ID', 'Date', 'Type', 'Notes'],
  'Policies': ['ID', 'Client ID', 'Insured ID', 'Policy Name', 'Policy No', 'Policy Type', 'Insurer', 'Date Bought', 'Premium',
               'Premium Frequency', 'Premium Term', 'Premium Term Value', 'Coverage', 'Status', 'End Date', 'Notes',
               'Writing Agent', 'Writing Agent Code', 'Writing Agent Contact', 'Servicing Agent', 'Servicing Agent Code', 'Servicing Agent Contact'],
};
// Columns that were renamed — older Excel files and saved data are upgraded automatically.
const RENAMED = { 'Clients': { 'Workplace': 'Company' }, 'Policies': { 'Product': 'Policy Name', 'Start Date': 'Date Bought', 'Frequency': 'Premium Frequency' } };
const KEY = { 'Clients': 'clients', 'Family': 'family', 'Extra Details': 'extras', 'Notes': 'notes',
              'Interactions': 'interactions', 'Policies': 'policies' };
const DATE_F = new Set(['Date of Birth', 'First Met', 'Last Met', 'Next Follow-up', 'Start Date', 'Date', 'Date Bought', 'End Date']);
const STAMP_F = new Set(['Created', 'Last Updated', 'Added']);
const NUM_F = new Set(['Premium', 'Coverage', 'Premium Term Value']);
const LONG_F = new Set(['Address', 'Remarks', 'Notes', 'Note', 'Value']);

const GENDERS = ['Male', 'Female'];
const INCOME_RANGES = ['Below $3k / month', '$3k – $6k / month', '$6k – $10k / month', '$10k – $20k / month', 'Above $20k / month'];
const HOW_MET = ['Referral', 'Friend / family', 'Colleague', 'Roadshow', 'Event / seminar', 'Social media', 'Cold call', 'Walk-in', 'Other'];
const INTERACTION_TYPES = ['Meeting', 'Meal / coffee', 'Policy review', 'Event', 'Call', 'Message', 'Email', 'Other'];
const IN_PERSON = new Set(['Meeting', 'Meal / coffee', 'Policy review', 'Event']);
const POLICY_STATUS = ['In force', 'Lapsed', 'Surrendered', 'Matured', 'Claimed', 'Terminated'];
const POLICY_TYPES = ['Whole life', 'Term', 'Investment-linked (ILP)', 'Endowment', 'Accident & health', 'Disability care', 'Universal life'];
const NO_TOTALS = new Set(['Accident & health']);   // these don't show premiums paid
const FREQUENCIES = ['Single premium', 'Annual', 'Semi-annual', 'Quarterly', 'Monthly'];
const FREQ_MONTHS = { 'Annual': 12, 'Semi-annual': 6, 'Quarterly': 3, 'Monthly': 1 };
const FREQ_UNIT = { 'Annual': 'year', 'Semi-annual': 'half-year', 'Quarterly': 'quarter', 'Monthly': 'month' };
const OLD_FREQ = { 'Yearly': 'Annual', 'Half-yearly': 'Semi-annual', 'Single': 'Single premium' };
const TERMS = [['Years', 'Number of years'], ['Till age', 'Until age'], ['Perpetual', 'Perpetually (whole life)']];
const EXTRA_SUGGESTIONS = ['Preferred language', 'Hobbies', 'Favourite food', 'Dietary needs', "Kids' school",
  'Pets', 'Car', 'Wedding anniversary', 'Preferred contact time', 'Social media', 'Referred by', 'Referred to', 'Life goals', 'Concerns'];

// "Related person is the client's <key>": [reverse key, male label, female label, neutral label]
const RELATIONS = {
  'spouse': ['spouse', 'Husband', 'Wife', 'Spouse'],
  'parent': ['child', 'Father', 'Mother', 'Parent'],
  'child': ['parent', 'Son', 'Daughter', 'Child'],
  'sibling': ['sibling', 'Brother', 'Sister', 'Sibling'],
  'grandparent': ['grandchild', 'Grandfather', 'Grandmother', 'Grandparent'],
  'grandchild': ['grandparent', 'Grandson', 'Granddaughter', 'Grandchild'],
  'parent-in-law': ['child-in-law', 'Father-in-law', 'Mother-in-law', 'Parent-in-law'],
  'child-in-law': ['parent-in-law', 'Son-in-law', 'Daughter-in-law', 'Child-in-law'],
  'sibling-in-law': ['sibling-in-law', 'Brother-in-law', 'Sister-in-law', 'Sibling-in-law'],
  'uncle/aunt': ['niece/nephew', 'Uncle', 'Aunt', 'Uncle / Aunt'],
  'niece/nephew': ['uncle/aunt', 'Nephew', 'Niece', 'Niece / Nephew'],
  'cousin': ['cousin', 'Cousin', 'Cousin', 'Cousin'],
  'other': ['other', 'Other', 'Other', 'Other relative'],
};

// Only Name is required.
const SECTIONS = [
  ['Personal', [
    { label: 'Name', type: 'text', required: true },
    { label: 'Nickname', type: 'text', placeholder: 'What you call them' },
    { label: 'Gender', type: 'select', options: GENDERS },
    { label: 'NRIC', type: 'text', placeholder: 'S1234567A', caps: 'characters' },
    { label: 'Date of Birth', type: 'date' },
  ]],
  ['Contact', [
    { label: 'Phone', type: 'tel' },
    { label: 'Email', type: 'email' },
    { label: 'Address', type: 'textarea', wide: true },
  ]],
  ['Work', [
    { label: 'Occupation', type: 'text', autofill: true },
    { label: 'Company', type: 'text', autofill: true },
    { label: 'Income Range', type: 'select', options: INCOME_RANGES },
  ]],
  ['How we know each other', [
    { label: 'How We Met', type: 'text', autofill: true, wide: true, placeholder: 'e.g. Referral from Jason, roadshow at Tampines Mall…' },
    { label: 'First Met', type: 'date' },
    { label: 'Last Met', type: 'date' },
    { label: 'Next Follow-up', type: 'date' },
  ]],
  ['Special remarks', [
    { label: 'Remarks', type: 'textarea', wide: true, rows: 6,
      placeholder: 'Anything worth remembering — personality, preferences, health notes, family situation, plans… Write as much as you like.' },
  ]],
];
const FORM_FIELDS = SECTIONS.flatMap(([, fs]) => fs.map(f => f.label));

/* =========================================================================
   Small helpers
   ========================================================================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '');
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const isISO = v => typeof v === 'string' && /^\d{4}-\d{2}-\d{2}/.test(v);
const blank = h => (DATE_F.has(h) || STAMP_F.has(h) || NUM_F.has(h)) ? null : '';
const nick = c => c && c.Nickname ? ` <span class="nick">“${esc(c.Nickname)}”</span>` : '';

/* =========================================================================

const getClient = id => db.clients.find(c => c.ID === id);

  const rev = (RELATIONS[key] || ['other'])[0];

// ---- Filling in family links that follow from the ones entered ----
// Rules: children of the same parent are siblings; a spouse is also a parent
// of the other spouse's children; siblings share parents; a parent's parent is
// a grandparent; a grandparent's spouse is a grandparent; siblings share grandparents.
// Links you remove are remembered and never added back automatically.
const pairKey = (a, b) => [a, b].sort().join('|');
function isIgnored(a, b) { return (db.meta.noLink || []).includes(pairKey(a, b)); }

  const rel = (a, key) => fam.filter(f => f['Client ID'] === a && f.Relationship === key).map(f => f['Related ID']).filter(id => getClient(id));
  const ensure = (a, b, key) => {   // b is a's <key>
    if (!a || !b || a === b || has(a, b) || has(b, a) || isIgnored(a, b)) return false;
    fam.push({ 'Client ID': a, 'Related ID': b, Relationship: key }, { 'Client ID': b, 'Related ID': a, Relationship: RELATIONS[key][0] });
    added.push({ a, b, key }); return true;
  };
  for (let round = 0, grew = true; grew && round < 6; round++) {
    grew = false;
    for (const c of db.clients) {
      const P = c.ID, kids = rel(P, 'child');
      for (let i = 0; i < kids.length; i++) for (let j = i + 1; j < kids.length; j++) grew = ensure(kids[i], kids[j], 'sibling') || grew;
      for (const S of rel(P, 'spouse')) for (const C of kids) grew = ensure(S, C, 'child') || grew;
      for (const Sib of rel(P, 'sibling')) for (const Pa of rel(P, 'parent')) grew = ensure(Pa, Sib, 'child') || grew;
      for (const G of rel(P, 'parent')) for (const C of kids) grew = ensure(C, G, 'grandparent') || grew;          // parent's parent
      for (const S of rel(P, 'spouse')) for (const GC of rel(P, 'grandchild')) grew = ensure(GC, S, 'grandparent') || grew;

function describeLink({ a, b, key }) {

  if (key === 'child') return `${A.Name} as ${B.Name}’s ${relLabel('parent', A.Gender).toLowerCase()}`;

}

async function linkAllSuggested(btn) {

function familyOf(id) {

function distinct(values, starters = []) {
  const counts = new Map(), spell = new Map();
  for (let v of [...values, ...starters]) {

const datalist = (id, opts) => `<datalist id="${id}">${opts.map(o => `<option value="${esc(o)}">`).join('')}</datalist>`;
// Everything searchable about one client, as [where, text] pairs.
// Grouped once and reused until the data changes.
let _docs = null;
function searchDocs() {
  if (_docs) return _docs;
  const by = {}, add = (id, k, v, show) => { if (v != null && String(v).trim()) (by[id] ||= []).push([k, String(v), show]); };
  for (const c of db.clients) {
    for (const k of ['Company', 'Address', 'Occupation', 'Email', 'Phone', 'How We Met']) add(c.ID, k, c[k]);
    if (c.NRIC) add(c.ID, 'NRIC', c.NRIC, maskNric(c.NRIC));
    add(c.ID, 'Special remarks', c.Remarks);
  }
  for (const e of db.extras) add(e['Client ID'], e.Field || 'Extra', `${e.Field} ${e.Value}`, e.Value);
  for (const n of db.notes) add(n['Client ID'], 'Note', n.Note);

    p['Writing Agent'], p['Writing Agent Code'], p['Servicing Agent'], p['Servicing Agent Code']].filter(Boolean).join(' · '));

const PROFILE_KEYS = new Set(['Company', 'Address', 'Occupation', 'Email', 'Phone', 'How We Met', 'NRIC']);

    const d = docs[c.ID] || [];
    const hay = [c.Name, c.Nickname, c.ID, ...d.map(x => x[1]), String(c.Phone || '').replace(/\D/g, '')].join(' \n ').toLowerCase();
    if (!tokens.every(t => hay.includes(t))) return null;

// Explains why someone matched when it wasn't their name: e.g. "Address: Blk 123 <mark>Ang</mark> Mo Kio Ave 3"
function highlight(text, tokens) {

  for (const t of tokens) out = out.replace(new RegExp('(' + esc(t).replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig'), '<mark>$1</mark>');

function matchInfo(c, q) {

  const name = `${c.Name || ''} ${c.Nickname || ''}`.toLowerCase();
  if (tokens.every(t => name.includes(t))) return '';
  const rest = tokens.filter(t => !name.includes(t)), hits = (searchDocs()[c.ID] || []).filter(([, v]) => rest.some(t => v.toLowerCase().includes(t)));
  if (!hits.length) return '';

  return hits.slice(0, 2).map(([k, v, show]) => {
    let txt = String(show ?? v).replace(/\s*\n\s*/g, ' · ');
    const low = txt.toLowerCase(), t0 = rest.find(t => low.includes(t));

   Navigation
   ========================================================================= */
let pendingToast = null, pendingAnchor = null, hooks = [];
function route() {
  const [h0, anchor] = (location.hash.slice(1) || '/').split('#'); const [path, qs] = h0.split('?');
  if (anchor && !pendingAnchor) pendingAnchor = anchor;   // e.g. #/c/C0001#policies scrolls to Policies
  return { parts: path.split('/').filter(Boolean).map(decodeURIComponent), q: new URLSearchParams(qs || '') };
}
function go(dest, msg, anchor, replace, kind = 'ok') {
  pendingToast = msg ? { msg, kind } : null; pendingAnchor = anchor || null;
  const cur = location.hash || '#/';
  if (dest === cur || (!dest)) render();
  else if (replace) location.replace(dest);
  else location.hash = dest;
}
function goBack() { if (history.length > 1) history.back(); else location.hash = '#/'; }
async function commit(msg, dest, anchor, replace = false, kind = 'ok') {
  try { await persist(); }
  catch (err) { toast('Could not save on this device: ' + (err && err.message || err), 'error'); return false; }
  go(dest || location.hash || '#/', msg, anchor, replace, kind); return true;
}
let toastTimer;
function toast(msg, kind = 'ok') {
  const t = $('#toast'); t.textContent = msg; t.className = 'toast ' + kind; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, kind === 'ok' ? 2600 : 5500);
}
function render() {
  const { parts, q } = route(); hooks = []; let html;
  try {
    if (!parts.length) html = pageHome();
    else if (parts[0] === 'search') html = pageSearch(q.get('q') || '');
    else if (parts[0] === 'new') html = pageForm(null, q.get('link'), q.get('rel'));
    else if (parts[0] === 'c' && parts[2] === 'p' && parts[3] === 'new') html = pagePolicyForm(parts[1], null);
    else if (parts[0] === 'c' && parts[2] === 'p' && parts[4] === 'edit') html = pagePolicyForm(parts[1], parts[3]);
    else if (parts[0] === 'c' && parts[2] === 'p') html = pagePolicy(parts[1], parts[3]);
    else if (parts[0] === 'c' && parts[2] === 'edit') html = pageForm(parts[1]);
    else if (parts[0] === 'c') html = pageProfile(parts[1]);
    else if (parts[0] === 'data') html = pageData();
    else html = pageNotFound();
  } catch (e) {
    console.error(e);
    html = `<section class="card"><h2>Something went wrong</h2><p class="muted">${esc(e.message)}</p><a class="btn" href="#/">Home</a></section>`;
  }
  $('#app').innerHTML = html;
  $('#back').hidden = !parts.length;
  $('#suggest').hidden = true;
  if (document.activeElement !== $('#q')) $('#q').value = parts[0] === 'search' ? (q.get('q') || '') : '';
  if (pendingAnchor) { const el = document.getElementById(pendingAnchor); el ? el.scrollIntoView({ block: 'start' }) : scrollTo(0, 0); pendingAnchor = null; }
  else scrollTo(0, 0);
  if (pendingToast) { toast(pendingToast.msg, pendingToast.kind); pendingToast = null; }
  hooks.forEach(f => f());
  document.title = (document.querySelector('h1, h2')?.textContent || '').trim().slice(0, 40) + ' · Client Book';
}

function backupBanner() {
  if (!db.clients.length) return '';
  const last = db.meta.lastExport, changed = db.meta.lastChange;
  if (last && (!changed || changed <= last)) return '';
  const days = last ? daysFrom(parseISO(last), today()) : null;
  if (last && days < 7) return '';
  return `<div class="banner warn"><span>${last ? `Last Excel backup was ${days} days ago.` : 'You haven’t backed up to Excel yet.'}
    Your data only lives on this iPad.</span><button class="btn small primary" onclick="exportExcel()">Back up now</button></div>`;
}

function pageHome() {

  const clients = [...db.clients].sort(byName);

    .sort((a, b) => a['Next Follow-up'].localeCompare(b['Next Follow-up']));

    const nb = nextBirthday(c['Date of Birth'], t); return { c, nb, days: daysFrom(t, nb), turns: ageOf(c['Date of Birth'], nb) };
  }).filter(b => b.days <= 30).sort((a, b) => a.days - b.days);

  const link = c => `<a href="#/c/${encodeURIComponent(c.ID)}">${esc(c.Name)}</a>${nick(c)}`;

    });

  return `${backupBanner()}
  <div class="dash">
    <section class="card"><h2>Follow-ups due <small>next 14 days</small></h2>
      ${fu.length ? `<ul class="mini">${fu.map(c => `<li>${link(c)}<span class="${parseISO(c['Next Follow-up']) <= t ? 'due' : 'muted'}">${fmtDate(c['Next Follow-up'])} · ${ago(c['Next Follow-up'])}</span></li>`).join('')}</ul>` : '<p class="muted">Nothing due.</p>'}
    </section>
    <section class="card"><h2>Birthdays <small>next 30 days</small></h2>
      ${bd.length ? `<ul class="mini">${bd.map(b => `<li>${link(b.c)}<span class="muted">${pad(b.nb.getDate())} ${MON[b.nb.getMonth()]} · turns ${b.turns}${b.days === 0 ? ' · <b>today!</b>' : ` · in ${b.days}d`}</span></li>`).join('')}</ul>` : '<p class="muted">No birthdays coming up.</p>'}
    </section>
    <section class="card"><h2>Recently updated</h2>
      ${recent.length ? `<ul class="mini">${recent.map(c => `<li>${link(c)}<span class="muted">${ago(c['Last Updated'])}</span></li>`).join('')}</ul>` : `<p class="muted">No clients yet — <a href="#/new">add your first one</a>, or <a href="#/data">import your Excel file</a>.</p>`}
    </section>
  </div>
  <section class="card">
    <div class="row-between"><h2>All clients <small id="clients-count">${clients.length}</small></h2>
      ${clients.length ? '<input id="filter" class="filter" type="search" placeholder="Filter by anything…" autocomplete="off" autocorrect="off" autocapitalize="off">' : ''}</div>

      ${clients.map(c => `<tr data-id="${esc(c.ID)}"><td>${link(c)}<div class="whybox"></div></td><td>${ageOf(c['Date of Birth']) ?? ''}</td><td class="nowrap">${esc(c.Phone)}</td><td>${esc(c.Company)}</td>
        <td class="nowrap">${fmtDate(c['Last Met'])}</td><td class="muted nowrap">${ago(c['Last Updated'])}</td></tr>`).join('')}

}

  if (res.length === 1) { setTimeout(() => location.replace('#/c/' + encodeURIComponent(res[0].ID)), 0); return ''; }
  return `<section class="card"><h2>${q ? `${res.length} result${res.length === 1 ? '' : 's'} for “${esc(q)}”` : 'Search'}</h2>

      : q ? '<p class="muted">No one matches that. <a href="#/new">Add a new client?</a></p>' : '<p class="muted">Type anything in the search box — a name, company, address, phone number, or words from notes, remarks, policies or the interaction log.</p>'}

function fieldHtml(f, val, sugg) {
  const n = slug(f.label), tag = f.required ? '<em class="req">required</em>' : '<em>optional</em>';
  let input;
  if (f.type === 'textarea') input = `<textarea name="${n}" rows="${f.rows || 3}" placeholder="${esc(f.placeholder || '')}">${esc(val || '')}</textarea>`;
  else if (f.type === 'select') input = `<select name="${n}"><option value="">—</option>${f.options.map(o => `<option${o === val ? ' selected' : ''}>${esc(o)}</option>`).join('')}${val && !f.options.includes(val) ? `<option selected>${esc(val)}</option>` : ''}</select>`;
  else if (f.type === 'date') input = dateBox(n, val, f.label);
  else {
    const caps = f.caps ? ` autocapitalize="${f.caps}"` : f.type === 'text' ? ' autocapitalize="words"' : '';
    input = `<input type="${f.type}" name="${n}" value="${esc(val ?? '')}" placeholder="${esc(f.placeholder || '')}"${f.required ? ' required' : ''}${caps}${f.inputmode ? ` inputmode="${f.inputmode}"` : ''}${f.autofill ? ` list="dl_${n}" autocomplete="off"` : ''}>`;
    if (f.autofill) input += datalist('dl_' + n, sugg[f.sugg || f.label] || []);
  }
  if (f.label === 'NRIC') input = input.replace('<input ', '<input data-nric="1" maxlength="20" ') + `<small class="dhint" id="nric-hint">${nricHint(val)}</small>`;
  return `<label class="${f.wide ? 'wide' : ''}"><span>${esc(f.show || f.label)} ${tag}</span>${input}</label>`;
}
const CAL_SVG = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>';
function toDMY(iso) { return isISO(iso) ? `${iso.slice(8, 10)}/${iso.slice(5, 7)}/${iso.slice(0, 4)}` : (iso || ''); }
// Typed date -> ISO (yyyy-mm-dd). Accepts 05/11/1985, 5-11-85, 05111985, 5 Nov 1985, 1985-11-05.
function parseTyped(s) {
  s = String(s || '').trim(); if (!s) return '';
  let d, m, y, x;
  if ((x = /^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(s))) [, y, m, d] = x;
  else if ((x = /^(\d{1,2})[\/\-. ](\d{1,2})[\/\-. ](\d{2}|\d{4})$/.exec(s))) [, d, m, y] = x;
  else if ((x = /^(\d{2})(\d{2})(\d{4}|\d{2})$/.exec(s))) [, d, m, y] = x;
  else if ((x = /^(\d{1,2})\s*([a-z]{3,})\.?,?\s*(\d{2}|\d{4})$/i.exec(s))) {
    const mi = MON.findIndex(k => x[2].toLowerCase().startsWith(k.toLowerCase())); if (mi < 0) return null;
    [d, m, y] = [x[1], mi + 1, x[3]];
  } else return null;
  d = +d; m = +m; y = +y;
  if (String(y).length <= 2) { const cy = new Date().getFullYear() % 100; y += y > cy ? 1900 : 2000; }
  const dt = new Date(y, m - 1, d);
  if (dt.getFullYear() !== y || dt.getMonth() !== m - 1 || dt.getDate() !== d) return null;
  return `${y}-${pad(m)}-${pad(d)}`;
}
function dateBox(n, val, label) {
  const iso = isISO(val) ? val.slice(0, 10) : '';
  return `<div class="datebox"><input type="text" class="dtext" name="${n}" value="${esc(toDMY(iso) || val || '')}" placeholder="DD/MM/YYYY"
      inputmode="numeric" autocomplete="off" autocorrect="off" spellcheck="false" maxlength="12" data-label="${esc(label)}">
    <span class="dpick" title="Pick from calendar">${CAL_SVG}<input type="date" tabindex="-1" aria-label="Pick ${esc(label)} from calendar" value="${iso}"></span></div>
    <small class="dhint">${iso ? dateHint(iso, label) : ''}</small>`;
}
function dateHint(iso, label) {
  const d = parseISO(iso), wd = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'][d.getDay()];
  const age = label === 'Date of Birth' ? ageOf(iso) : null;
  const held = label === 'Date Bought' && d <= today() ? ymText(monthsBetween(d, today())) + ' ago' : '';
  return `${wd}, ${fmtDate(iso)}${age != null && age >= 0 ? ` · age ${age}` : ''}${held ? ` · ${held}` : ''}`;
}
function checkDate(input) {
  const hint = input.closest('label').querySelector('.dhint'), pick = input.parentNode.querySelector('input[type=date]');
  const v = input.value.trim(), iso = parseTyped(v);
  if (!v) { hint.textContent = ''; hint.classList.remove('bad'); pick.value = ''; return ''; }
  if (iso) { input.value = toDMY(iso); pick.value = iso; hint.textContent = dateHint(iso, input.dataset.label); hint.classList.remove('bad'); return iso; }
  hint.textContent = 'Type the date as DD/MM/YYYY'; hint.classList.add('bad'); return null;
}
// NRIC: live check that it's 9 characters, e.g. S1234567A
function nricHint(v) {
  v = String(v || '').toUpperCase().replace(/\s+/g, ''); const n = v.length;
  if (!n) return '';
  if (n < 9) return `<span class="bad">${n} of 9 characters · ${9 - n} too few</span>`;
  if (n > 9) return `<span class="bad">${n} of 9 characters · ${n - 9} too many</span>`;
  if (!/^[STFGM]\d{7}[A-Z]$/.test(v)) return '<span class="bad">9 characters, but it should look like S1234567A</span>';
  return '<span class="good">✓ 9 characters</span>';
}
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset && t.dataset.nric) {
    const pos = t.selectionStart, up = t.value.toUpperCase().replace(/\s+/g, '');
    if (up !== t.value) { t.value = up; try { t.setSelectionRange(pos, pos); } catch (_) {} }
    const h = document.getElementById('nric-hint'); if (h) h.innerHTML = nricHint(t.value);
  }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.classList && t.classList.contains('dtext')) {
    const hint = t.closest('label').querySelector('.dhint'); hint.classList.remove('bad');
    // Auto-insert slashes while typing digits: 05111985 -> 05/11/1985
    if (!/^[\d\/]*$/.test(t.value) || (e.inputType || '').startsWith('delete') || e.data === '/') return;
    const parts = t.value.split('/');
    if (parts.slice(0, -1).some(x => x.length !== 2)) return; // typed their own slashes, e.g. 1/3/21
    const digits = t.value.replace(/\D/g, '').slice(0, 8);
    t.value = digits.length > 4 ? `${digits.slice(0, 2)}/${digits.slice(2, 4)}/${digits.slice(4)}`
            : digits.length > 2 ? `${digits.slice(0, 2)}/${digits.slice(2)}` : digits;
    if (digits.length === 8) checkDate(t);
  } else if (t.type === 'date' && t.closest && t.closest('.dpick')) {
    const txt = t.closest('.datebox').querySelector('.dtext'); txt.value = t.value ? toDMY(t.value) : ''; checkDate(txt);
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.type === 'date' && t.closest && t.closest('.dpick')) { const txt = t.closest('.datebox').querySelector('.dtext'); txt.value = t.value ? toDMY(t.value) : ''; checkDate(txt); }

async function saveClient(e) {
  e.preventDefault();
  const form = e.target, fd = new FormData(form), { cid, link, rel } = form.dataset;
  const data = {};
  for (const label of FORM_FIELDS) {
    let v = String(fd.get(slug(label)) || '').trim();
    if (label === 'NRIC') v = v.toUpperCase().replace(/\s+/g, '');
    if (DATE_F.has(label) && v) {
      const iso = parseTyped(v);
      if (!iso) { const el = form.querySelector(`[name="${slug(label)}"]`); checkDate(el); el.focus(); toast(`${label}: type the date as DD/MM/YYYY.`, 'error'); return false; }
      v = iso;
    }
    data[label] = v || blank(label);
  }
  const fs = fd.getAll('extra_field'), vs = fd.getAll('extra_value'), extras = [];
  fs.forEach((f, i) => { f = String(f).trim(); const v = String(vs[i] || '').trim(); if (f || v) extras.push({ Field: f || 'Note', Value: v }); });
  if (!data.Name) { toast('Name is required — everything else is optional.', 'error'); return false; }
  const warn = [];
  if (data.NRIC && data.NRIC.length !== 9) {
    const n = data.NRIC.length;
    if (!confirm(`The NRIC “${data.NRIC}” has ${n} characters — it should have 9 (${n < 9 ? 9 - n + ' too few' : n - 9 + ' too many'}).\n\nSave anyway?`)) {
      const el = form.querySelector('[name=nric]'); el.focus(); return false;
    }
  }
  if (data.NRIC) {
    if (data.NRIC.length === 9 && !/^[STFGM]\d{7}[A-Z]$/.test(data.NRIC)) warn.push(`NRIC “${data.NRIC}” doesn’t look like a standard NRIC/FIN — saved anyway.`);
    const dup = db.clients.find(c => c.ID !== cid && String(c.NRIC || '').toUpperCase() === data.NRIC);
    if (dup) { toast(`That NRIC already belongs to ${dup.Name} (${dup.ID}).`, 'error'); return false; }
  }
  let target;
  if (cid) { target = getClient(cid); Object.assign(target, data); }
  else {
    target = {}; for (const h of SHEETS.Clients) target[h] = blank(h);
    Object.assign(target, data, { ID: nextId(db.clients, 'C'), Created: nowStamp() });
    db.clients.push(target);
  }
  touch(target); setExtras(target.ID, extras);
  let msg = cid ? 'Profile updated.' : `Saved ${target.Name}.`, dest = '#/c/' + encodeURIComponent(target.ID), anchor = null;
  const lc = link && getClient(link);
  if (!cid && lc && RELATIONS[rel]) {
    addLink(lc.ID, target.ID, rel); touch(lc);
    const extra = applyInferred(inferLinks().filter(l => familyGroup(lc.ID).has(l.a)));
    msg = `Saved ${target.Name} and linked to ${lc.Name}.` + extra; dest = '#/c/' + encodeURIComponent(lc.ID); anchor = 'family';
  }
  if (warn.length) msg += ' ' + warn.join(' ');
  await commit(msg, dest, anchor, true, warn.length ? 'warn' : 'ok');
  return false;
}

function pageData() {
  const counts = Object.entries(KEY).map(([n, k]) => `<span><b>${db[k].length}</b> ${n === 'Clients' ? 'clients' : n.toLowerCase()}</span>`).join('');
  hooks.push(async () => {
    const prev = await kvGet('prev'), w = $('#undo-wrap');
    if (prev && w) w.innerHTML = `Imported or erased by mistake? <button class="link" onclick="undoImport()">Restore the previous data</button> (${prev.clients.length} clients).`;

  hooks.push(async () => {

function migratePolicies(d) {
  for (const p of d.policies) {
    if (OLD_FREQ[p['Premium Frequency']]) p['Premium Frequency'] = OLD_FREQ[p['Premium Frequency']];
    if (!p['Insured ID']) p['Insured ID'] = p['Client ID'];
  }
}
function addMonthsD(d, n) {
  const t = new Date(d.getFullYear(), d.getMonth() + n, 1), last = new Date(t.getFullYear(), t.getMonth() + 1, 0).getDate();
  t.setDate(Math.min(d.getDate(), last)); return t;
}
function monthsBetween(a, b) {
  let m = (b.getFullYear() - a.getFullYear()) * 12 + b.getMonth() - a.getMonth();
  if (b < addMonthsD(a, m)) m--; return m;
}
function ymText(m) {
  if (m < 1) return 'under a month';
  const y = Math.floor(m / 12), mo = m % 12;
  return [y ? `${y} yr${y > 1 ? 's' : ''}` : '', mo ? `${mo} mth${mo > 1 ? 's' : ''}` : ''].filter(Boolean).join(' ');
}
function insuredOf(p) { return getClient(p['Insured ID']) || getClient(p['Client ID']); }
function premText(p) {
  const v = p.Premium, f = p['Premium Frequency'];
  if (v == null || v === '') return '';
  const m = typeof v === 'number' ? money(v) : v;
  if (f === 'Single premium') return `${m} single premium`;
  return FREQ_UNIT[f] ? `${m} / ${FREQ_UNIT[f]}` : m;
}
// Works out how long the policy has been held and what has been paid.
// Premiums are due on the date bought and every period after it, until the
// premium term ends, the policy ends (end date), or today.
function policyCalc(p) {
  const r = { noTotals: NO_TOTALS.has(p['Policy Type']) };
  const bought = parseISO(p['Date Bought']);
  if (!bought) { r.missing = 'Add the date bought'; return r; }
  const t = today(), end = parseISO(p['End Date']);
  r.ended = !!p.Status && p.Status !== 'In force';
  r.needsEnd = r.ended && !end;
  const asOf = r.ended && end && end < t ? end : t;
  r.bought = bought; r.asOf = asOf; r.future = bought > t;
  r.heldMonths = r.future ? 0 : monthsBetween(bought, asOf);
  const f = p['Premium Frequency'], period = FREQ_MONTHS[f], prem = typeof p.Premium === 'number' ? p.Premium : null;
  r.single = f === 'Single premium'; r.perpetual = !r.single && p['Premium Term'] === 'Perpetual';
  let termEnd = null; const tv = +p['Premium Term Value'];
  if (!r.single && p['Premium Term'] === 'Years' && tv > 0) termEnd = addMonthsD(bought, 12 * tv);
  if (!r.single && p['Premium Term'] === 'Till age' && tv > 0) {
    const ins = insuredOf(p), dob = ins && parseISO(ins['Date of Birth']);
    if (dob) termEnd = addMonthsD(dob, 12 * tv); else r.needDob = ins ? ins.Name : 'the insured person';
  }
  r.termEnd = termEnd;
  const count = limit => {
    if (r.single) return bought <= limit ? 1 : 0;
    if (!period) return null;
    let n = 0;
    for (let k = 0; k < 2400; k++) { const d = addMonthsD(bought, k * period); if (d > limit || (termEnd && d >= termEnd)) break; n++; }
    return n;
  };
  r.paidCount = count(asOf);
  r.totalCount = r.single ? 1 : (termEnd && period ? count(new Date(9999, 0, 1)) : null);
  if (r.ended && r.paidCount != null && !r.needsEnd) r.totalCount = r.paidCount; // ended: no more premiums
  r.paid = prem != null && r.paidCount != null ? prem * r.paidCount : null;
  r.projected = prem != null && r.totalCount != null ? prem * r.totalCount : null;
  r.annual = prem != null && period ? prem * 12 / period : null;
  r.done = r.totalCount != null && r.paidCount >= r.totalCount && !r.future;
  r.leftMonths = termEnd && termEnd > t && !r.ended ? monthsBetween(t, termEnd) : 0;
  if (prem == null) r.why = 'Add the premium amount';
  else if (!f) r.why = 'Add the premium frequency';
  return r;
}
function termText(p, r) {
  const v = +p['Premium Term Value'];
  if (p['Premium Frequency'] === 'Single premium') return 'One-time payment';
  if (p['Premium Term'] === 'Years' && v) return `${v} year${v > 1 ? 's' : ''}${r && r.termEnd ? ` (until ${fmtDate(isoOf(r.termEnd))})` : ''}`;
  if (p['Premium Term'] === 'Till age' && v) return `Until age ${v}${r && r.termEnd ? ` (${fmtDate(isoOf(r.termEnd))})` : ''}`;
  if (p['Premium Term'] === 'Perpetual') return 'Perpetually (whole life)';

}
function isoOf(d) { return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }

}

  const f = db.family.find(x => x['Client ID'] === ownerId && x['Related ID'] === otherId), o = getClient(otherId);
  return f && o ? ` <span class="muted">· ${esc(relLabel(f.Relationship, o.Gender).toLowerCase())}</span>` : '';
}
function policyRow(p, viewer) {
  const r = policyCalc(p), cid = encodeURIComponent(p['Client ID']), pid = encodeURIComponent(p.ID), ins = insuredOf(p), own = getClient(p['Client ID']);

  const meta = [who, p['Date Bought'] ? 'Bought ' + fmtDate(p['Date Bought']) : '', premText(p),

  return `<li><a href="#/c/${cid}/p/${pid}"><div class="pol-top"><b>${esc(p['Policy Name'] || 'Untitled policy')} ›</b>
    ${p['Policy Type'] ? `<span class="tag">${esc(p['Policy Type'])}</span>` : ''}${statusTag(p, r)}</div>

      nd[KEY[name]].push(o);
    }
  }
  nd.clients = nd.clients.filter(c => c.Name);
  moveNicknames(nd); migratePolicies(nd);
  for (const c of nd.clients) if (!c.ID) c.ID = nextId(nd.clients, 'C');
  for (const [k, p] of [['notes', 'N'], ['interactions', 'I'], ['policies', 'P']]) for (const r of nd[k]) if (!r.ID) r.ID = nextId(nd[k], p);
  return nd;
}
async function importExcel(input) {
  const file = input.files && input.files[0]; input.value = ''; if (!file) return;
  try {
    const nd = bookToDb(await readXlsx(await file.arrayBuffer()));
    const msg = `Replace everything on this iPad (${db.clients.length} clients) with ${nd.clients.length} clients from “${file.name}”?`
      + (db.clients.length ? '\n\nYou can undo this afterwards from this page.' : '');
    if (!confirm(msg)) return;
    if (db.clients.length) await kvSet('prev', JSON.parse(JSON.stringify(db)));
    nd.meta = { lastExport: nowStamp(), lastChange: null };
    db = nd; await commit(`Imported ${db.clients.length} clients.`, '#/', null, true);
  } catch (e) { console.error(e); toast('Import failed: ' + e.message, 'error'); }
}
async function undoImport() {
  const prev = await kvGet('prev'); if (!prev) return;
  if (!confirm(`Restore the previous ${prev.clients.length} clients? Whatever is on this iPad now will be replaced.`)) return;
  await kvSet('prev', JSON.parse(JSON.stringify(db)));
  db = Object.assign(emptyDb(), prev); await commit('Previous data restored.', '#/', null, true);
}

/* =========================================================================
   Header search with live suggestions
   ========================================================================= */
(function () {
  const q = $('#q'), box = $('#suggest'); let items = [], active = -1;
  const draw = () => {
    if (!items.length) { box.hidden = true; return; }
    box.innerHTML = items.map((c, i) => `<a href="#/c/${encodeURIComponent(c.ID)}" class="${i === active ? 'on' : ''}"><b>${esc(c.Name)}${nick(c)}</b>
      <span>${[c.Company, c.Phone, c.ID].filter(Boolean).map(esc).join(' · ')}</span>${matchInfo(c, q.value)}</a>`).join('');
    box.hidden = false;
  };
  q.addEventListener('input', () => { items = q.value.trim() ? searchClients(q.value).slice(0, 8) : []; active = -1; draw(); });
  q.addEventListener('focus', () => { if (q.value.trim()) { items = searchClients(q.value).slice(0, 8); draw(); } });
  q.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown' && items.length) { active = Math.min(active + 1, items.length - 1); draw(); e.preventDefault(); }
    else if (e.key === 'ArrowUp' && items.length) { active = Math.max(active - 1, 0); draw(); e.preventDefault(); }
    else if (e.key === 'Enter') {
      e.preventDefault(); const v = q.value.trim(); if (!v) return;
      const target = active >= 0 ? items[active] : null; box.hidden = true; q.blur();
      location.hash = target ? '#/c/' + encodeURIComponent(target.ID) : '#/search?q=' + encodeURIComponent(v);
    } else if (e.key === 'Escape') box.hidden = true;
  });
  box.addEventListener('click', () => { box.hidden = true; q.blur(); });
  document.addEventListener('click', e => { if (!box.contains(e.target) && e.target !== q) box.hidden = true; });
})();

/* =========================================================================
   Start
   ========================================================================= */
window.addEventListener('hashchange', render);
(async function start() {
  const saved = await kvGet('db');
  if (saved) db = Object.assign(emptyDb(), saved, { meta: Object.assign(emptyDb().meta, saved.meta || {}) });
  moveNicknames(db);
  for (const [sheet, map] of Object.entries(RENAMED)) for (const r of db[KEY[sheet]])
    for (const [o, n] of Object.entries(map)) if (o in r) { if (!r[n]) r[n] = r[o]; delete r[o]; }
  migratePolicies(db);
  render();
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
